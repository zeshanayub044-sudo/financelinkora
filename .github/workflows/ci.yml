name: Linkora Finance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit and component tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Production build
        run: pnpm build

  database:
    name: Local migration and pgTAP checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Start an isolated local Supabase stack
        run: supabase start
      - name: Rebuild the local database from migration history
        run: supabase db reset --no-seed
      - name: Run pgTAP security and accounting suite against local database only
        shell: bash
        run: |
          set +e
          supabase test db > "$RUNNER_TEMP/linkora-pgtap.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/linkora-pgtap.log"
          if [ "$status" -ne 0 ]; then
            {
              echo '### pgTAP failure details (isolated local database)'
              echo
              echo '```text'
              grep -E 'ERROR:|LINE [0-9]+:|DETAIL:|CONTEXT:|Failed test|have:|want:|caught:|wanted:|Dubious|Failed [0-9]+/[0-9]+|Tests:|Parse errors:|Result:' "$RUNNER_TEMP/linkora-pgtap.log" \
                | head -n 120 \
                | sed -E 's/sb_(publishable|secret)_[A-Za-z0-9_-]+/[REDACTED]/g; s/eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}/[REDACTED]/g' || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
